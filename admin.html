<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – Script Industries</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<header><a class="logo" href="index.html">Script<span>Industries</span></a><nav><a href="index.html">← Zur Seite</a></nav></header>

<div class="panel" id="login">
  <h2>🔒 Admin Login</h2>
  <label>GitHub Token (nur Repo-Zugriff)</label>
  <input type="password" id="token" placeholder="github_pat_...">
  <button class="btn" onclick="login()">Einloggen</button>
  <div class="msg" id="lmsg"></div>
</div>

<div id="app" style="display:none">
  <div class="panel">
    <h2>⬆ Datei hochladen</h2>
    <label>Datei</label><input type="file" id="file">
    <label>Titel</label><input id="title">
    <label>Kategorie</label><input id="category" placeholder="z.B. Roblox, Minecraft, Discord">
    <label>Beschreibung</label><textarea id="desc" rows="3"></textarea>
    <label>Vorschaubild (optional)</label><input type="file" id="img" accept="image/*">
    <button class="btn" id="up" onclick="upload()">Hochladen</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="panel">
    <h2>📁 Deine Dateien</h2>
    <div id="list"></div>
    <button class="btn ghost" onclick="logout()">Ausloggen</button>
  </div>
</div>

<script>
const API=`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/`;
let TOKEN=localStorage.getItem("si_token");
const H=()=>({Authorization:"Bearer "+TOKEN,Accept:"application/vnd.github+json"});
const $=id=>document.getElementById(id);

async function login(){
  TOKEN=$("token").value.trim();
  const r=await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}`,{headers:H()});
  const j=await r.json();
  if(!r.ok||!j.permissions?.push){$("lmsg").textContent="❌ Token ungültig oder keine Schreibrechte.";return}
  localStorage.setItem("si_token",TOKEN);show();
}
function logout(){localStorage.removeItem("si_token");location.reload()}
function show(){$("login").style.display="none";$("app").style.display="block";loadList()}
if(TOKEN)show();

const b64=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.readAsDataURL(f)});
const utf8b64=s=>btoa(unescape(encodeURIComponent(s)));

async function getManifest(){
  const r=await fetch(API+"files.json?ref="+CONFIG.branch,{headers:H()});
  const j=await r.json();
  return {sha:j.sha,data:JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))))};
}
async function put(path,content,msg,sha){
  const r=await fetch(API+path,{method:"PUT",headers:H(),body:JSON.stringify({message:msg,content,branch:CONFIG.branch,...(sha&&{sha})})});
  if(!r.ok)throw new Error((await r.json()).message);
  return r.json();
}
async function upload(){
  const f=$("file").files[0];if(!f)return $("msg").textContent="Bitte Datei wählen.";
  if(f.size>50e6)return $("msg").textContent="❌ Max. 50 MB pro Datei (GitHub-Limit).";
  $("up").disabled=true;$("msg").textContent="⏳ Lade hoch...";
  try{
    const id=Date.now(),safe=f.name.replace(/[^\w.\-]/g,"_"),path=`files/${id}_${safe}`;
    await put(path,await b64(f),"Upload "+safe);
    let image="";
    const im=$("img").files[0];
    if(im){image=`files/${id}_thumb_${im.name.replace(/[^\w.\-]/g,"_")}`;await put(image,await b64(im),"Thumbnail")}
    const m=await getManifest();
    m.data.push({id,title:$("title").value||f.name,category:$("category").value||"Sonstiges",description:$("desc").value,file:path,image,size:f.size,date:new Date().toISOString()});
    await put("files.json",utf8b64(JSON.stringify(m.data,null,2)),"Add "+safe,m.sha);
    $("msg").textContent="✅ Hochgeladen! In ~1 Minute auf der Seite sichtbar.";
    ["file","title","category","desc","img"].forEach(k=>$(k).value="");loadList();
  }catch(e){$("msg").textContent="❌ "+e.message}
  $("up").disabled=false;
}
async function loadList(){
  const m=await getManifest();
  $("list").innerHTML=m.data.length?m.data.map(i=>`<div class="list-row"><span>${i.title.replace(/</g,"&lt;")}</span><button onclick="del(${i.id})">Löschen</button></div>`).join(""):"<p>Noch nichts hochgeladen.</p>";
}
async function del(id){
  if(!confirm("Wirklich löschen?"))return;
  const m=await getManifest(),it=m.data.find(i=>i.id===id);
  for(const p of [it.file,it.image].filter(Boolean)){
    const r=await fetch(API+p+"?ref="+CONFIG.branch,{headers:H()});
    if(r.ok){const {sha}=await r.json();await fetch(API+p,{method:"DELETE",headers:H(),body:JSON.stringify({message:"Delete "+p,sha,branch:CONFIG.branch})})}
  }
  const m2=await getManifest();
  await put("files.json",utf8b64(JSON.stringify(m2.data.filter(i=>i.id!==id),null,2)),"Remove",m2.sha);
  loadList();
}
</script>
</body>
</html>
